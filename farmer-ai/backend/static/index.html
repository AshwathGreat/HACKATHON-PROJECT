<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Farmer AI - Test Interface</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #f6f8f4; color: #1c2b1c; }
  h1 { font-size: 1.4rem; }
  .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px; }
  input[type=file] { display: block; margin: 12px 0; }
  button { background: #2e7d32; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 1rem; }
  button:disabled { background: #9e9e9e; }
  #preview { max-width: 100%; border-radius: 8px; margin-top: 10px; display: none; }
  .result-row { margin: 6px 0; }
  .label { font-weight: 600; }
  .low-conf { color: #b26a00; }
  .warning { background: #fff3e0; border-left: 4px solid #ff9800; padding: 8px 12px; margin-top: 10px; border-radius: 4px; }
  ul { margin: 4px 0; padding-left: 20px; }
  #status { color: #666; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>🌾 Farmer AI Assistant — Internal Test Interface</h1>
  <p style="color:#555;">This is a fallback testing page (Phase 3), not the farmer-facing product. The real interface is WhatsApp.</p>

  <div class="card">
    <label for="fileInput"><b>Upload a tomato leaf photo:</b></label>
    <input type="file" id="fileInput" accept="image/*" />
    <img id="preview" />
    <button id="diagnoseBtn" disabled>Diagnose</button>
    <div id="status"></div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="result-row"><span class="label">Crop:</span> <span id="rCrop"></span></div>
    <div class="result-row"><span class="label">Disease:</span> <span id="rDisease"></span></div>
    <div class="result-row"><span class="label">Confidence:</span> <span id="rConfidence"></span></div>
    <div class="result-row" id="rSymptomsRow"><span class="label">Symptoms:</span> <span id="rSymptoms"></span></div>
    <div class="result-row"><span class="label">Immediate actions:</span><ul id="rActions"></ul></div>
    <div class="result-row"><span class="label">Prevention:</span><ul id="rPrevention"></ul></div>
    <div class="warning" id="rWarning" style="display:none;"></div>
    <div class="result-row" style="font-size:0.85rem;color:#777;"><span class="label">Source:</span> <span id="rSource"></span></div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const diagnoseBtn = document.getElementById('diagnoseBtn');
    const statusEl = document.getElementById('status');
    const resultCard = document.getElementById('resultCard');

    let selectedFile = null;

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      selectedFile = file;
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      diagnoseBtn.disabled = false;
      resultCard.style.display = 'none';
      statusEl.textContent = '';
    });

    diagnoseBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      diagnoseBtn.disabled = true;
      statusEl.textContent = 'Analyzing image...';

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        const res = await fetch('/diagnose', { method: 'POST', body: formData });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Request failed (${res.status})`);
        }
        const data = await res.json();
        renderResult(data);
        statusEl.textContent = '';
      } catch (e) {
        statusEl.textContent = 'Error: ' + e.message;
      } finally {
        diagnoseBtn.disabled = false;
      }
    });

    function renderResult(data) {
      resultCard.style.display = 'block';
      document.getElementById('rCrop').textContent = data.crop || '—';
      document.getElementById('rDisease').textContent = data.disease || '—';
      document.getElementById('rConfidence').textContent = (data.confidence * 100).toFixed(1) + '%';
      document.getElementById('rConfidence').className = data.low_confidence ? 'low-conf' : '';

      const symptomsRow = document.getElementById('rSymptomsRow');
      if (data.symptoms) {
        symptomsRow.style.display = 'block';
        document.getElementById('rSymptoms').textContent = data.symptoms;
      } else {
        symptomsRow.style.display = 'none';
      }

      const actionsList = document.getElementById('rActions');
      actionsList.innerHTML = '';
      (data.immediate_actions || []).forEach(a => {
        const li = document.createElement('li');
        li.textContent = a;
        actionsList.appendChild(li);
      });

      const preventionList = document.getElementById('rPrevention');
      preventionList.innerHTML = '';
      (data.prevention || []).forEach(p => {
        const li = document.createElement('li');
        li.textContent = p;
        preventionList.appendChild(li);
      });

      const warningEl = document.getElementById('rWarning');
      if (data.warning) {
        warningEl.style.display = 'block';
        warningEl.textContent = '⚠️ ' + data.warning;
      } else {
        warningEl.style.display = 'none';
      }

      document.getElementById('rSource').textContent = data.source || (data.message || 'N/A');
    }
  </script>
</body>
</html>
